<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio Asesmen II-2100 — Galaxy Irghi</title>
    <style>
        :root {
            /* Galaxy Palette */
            --bg: #030508;
            --panel: rgba(255, 255, 255, 0.05); /* Glass Effect */
            --ink: #edeff2;
            --muted: #94a3b8;
            --brand: #bc13fe; /* Neon Purple */
            --accent: #7a04eb; /* Deep Violet */
            --glow: rgba(188, 19, 254, 0.4);
            --line: rgba(255, 255, 255, 0.1);
            --ease: cubic-bezier(.22,.61,.36,1);
            --profile-image: url('assets/foto\ profil.jpg');
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--ink);
            overflow-x: hidden;
        }

        /* ========== GALAXY BACKGROUND ========== */
        .stars-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
        }

        .stars-container::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 2px; height: 2px;
            background: white;
            box-shadow: 
                24vw 10vh 1px white, 80vw 50vh 2px white, 40vw 30vh 1.5px white, 
                10vw 80vh 1px white, 90vw 20vh 2px white, 55vw 60vh 1px white,
                15vw 40vh 1.2px white, 70vw 90vh 2px white, 30vw 15vh 1px white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle 5s infinite alternate;
        }

        .blobs { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; filter: blur(80px); }
        .blob { position: absolute; border-radius: 50%; opacity: 0.3; animation: float 20s infinite ease-in-out; }
        .blob-1 { width: 400px; height: 400px; background: var(--brand); top: -10%; left: -10%; }
        .blob-2 { width: 350px; height: 350px; background: var(--accent); bottom: 10%; right: -5%; animation-delay: -5s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, 40px) scale(1.1); }
            66% { transform: translate(-30px, 60px) scale(0.9); }
        }

        @keyframes twinkle { from { opacity: 0.3; } to { opacity: 0.8; } }

        /* ========== LAYOUT & COMPONENTS ========== */
        .wrap { display: grid; grid-template-columns: 320px 1fr; min-height: 100vh; }

        aside {
            background: rgba(10, 12, 16, 0.75);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--line);
            padding: 25px 20px;
            position: sticky;
            top: 0; height: 100vh;
            overflow-y: auto;
        }

        .brand {
            font-weight: 800;
            font-size: 20px;
            margin-bottom: 24px;
            color: #fff;
            text-shadow: 0 0 10px var(--brand);
            letter-spacing: 0.5px;
        }

        .search input {
            width: 100%; padding: 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            transition: all 0.3s var(--ease);
        }

        .search input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 15px var(--glow); }

        .toc { list-style: none; padding: 0; margin-top: 25px; }
        .toc a {
            display: block; padding: 12px 15px; margin-bottom: 6px;
            border-radius: 10px; color: var(--muted); text-decoration: none;
            transition: all 0.3s var(--ease);
        }

        .toc a:hover { background: rgba(188, 19, 254, 0.1); color: #fff; transform: translateX(5px); }
        .toc a.active { background: var(--brand); color: #fff; font-weight: 600; box-shadow: 0 0 20px var(--glow); }

        main { padding: 40px 50px; display: flex; flex-direction: column; align-items: center; }

        .meta {
            display: flex; justify-content: space-between; max-width: 800px; width: 100%;
            margin-bottom: 25px; padding: 18px 25px;
            background: var(--panel); backdrop-filter: blur(10px);
            border-radius: 15px; border: 1px solid var(--line);
            font-size: 14px;
        }

        .meta b { color: #fff; font-size: 15px; }

        .hero {
            display: flex; align-items: center; gap: 30px;
            background: var(--panel); backdrop-filter: blur(15px);
            padding: 40px; border-radius: 24px; border: 1px solid var(--line);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            transition: all 0.4s var(--ease);
            width: 100%; max-width: 800px;
        }

        .hero:hover { transform: translateY(-5px); border-color: var(--brand); }
        .hero h2 { margin: 0 0 10px; font-size: 30px; color: #fff; text-shadow: 0 0 15px var(--glow); }
        .hero .img {
            width: 180px; height: 180px; flex-shrink: 0;
            background: var(--profile-image) center/cover no-repeat;
            border-radius: 50%; border: 3px solid var(--brand);
            box-shadow: 0 0 20px var(--brand);
        }

        /* TABLES & CONTENT */
        .shape-table {
            width: 100%; border-collapse: separate;
            background: var(--panel); backdrop-filter: blur(10px);
            border: 1px solid var(--line); border-radius: 15px; overflow: hidden;
        }
        .shape-table thead th { background: linear-gradient(90deg, var(--accent), var(--brand)); color: #fff; padding: 15px; }
        .shape-table tbody td, .shape-table tbody th { padding: 15px; border-top: 1px solid var(--line); }
        .shape-table tbody th { color: var(--brand); }

        .file-card {
            display: flex; align-items: center; gap: 20px;
            background: var(--panel); padding: 20px; border-radius: 15px;
            border: 1px solid var(--line); text-decoration: none; transition: 0.3s;
        }
        .file-card:hover { background: rgba(255,255,255,0.1); border-color: var(--brand); }
        .file-card .icon { font-size: 32px; filter: drop-shadow(0 0 5px var(--brand)); }
        .file-card .name { color: #fff; font-weight: 600; margin: 0; }
        
        mark { background: var(--brand); color: white; padding: 0 4px; border-radius: 4px; }
        
        audio { width: 100%; filter: invert(100%) hue-rotate(180deg) brightness(1.5); margin: 20px 0; }

        @media (max-width: 920px) {
            .wrap { grid-template-columns: 1fr; }
            aside { height: auto; position: relative; }
            .hero { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="stars-container"></div>
    <div class="blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="wrap">
        <aside>
            <div class="brand">Irghi Satya Priangga</div>
            <div class="search"><input id="search" type="search" placeholder="Cari kata.."></div>
            <ul id="toc" class="toc"></ul>
        </aside>

        <main>
            <h1 id="page-title" style="color: #fff; text-shadow: 0 0 10px var(--glow); margin-bottom: 30px;"></h1>
            <div id="page-content" style="width: 100%; max-width: 850px;"></div>
        </main>
    </div>

    <script>
        const PAGES = [
            { 
                id: 'selamat-berjumpa', 
                title: 'Perkenalan diri', 
                content: `<article>
                    <div class='meta'>
                        <div><b>Author</b><br>Irghi Satya Priangga</div>
                        <div><b>Published</b><br>${new Date().toLocaleDateString('id-ID')}</div>
                    </div>
                    <div class='hero'>
                        <div class='copy'>
                            <h2>Quit Talking and Start Coding</h2>
                            <p>Informatics and Geography Enthusiast yang suka banget teknologi dan suka hapalin nama dan bendera negara yang ada di dunia!</p>
                        </div>
                        <div class='img'></div>
                    </div>
                    <section style='margin-top:40px; text-align:center; line-height:1.8;'>
                        <h3 style='color:var(--brand);'>About me</h3>
                        <p>Seorang mahasiswa tingkat 2 di Sekolah Teknik Elektro dan Informatika-Komputasi Institut Teknologi Bandung.</p>
                        <p>Berkecimpung di dunia informatika khususnya pada bidang UI/UX dan Web Development.</p>
                    </section>
                </article>`
            },
            {
                id: 'kisah-identitas',
                title: '1. All About Me',
                content: `<article style="line-height:1.8;">
                    <h2 style="text-align:center; color:var(--brand);">Hello World!</h2>
                    <p>Perkenalkan, <b>Irghi Satya Priangga</b>, mahasiswa tingkat 2 yang sangat suka dunia informatika. Mengenal informatika sejak masa SMA dan langsung menyukai semua hal didalamnya. Khususnya pada bidang UI/UX.</p>
                    <p>Aktif di berbagai kegiatan kepanitiaan HMIF dan Dokumentasi BPA STEI-K24. Selain IT, saya sangat menyukai Geografi, menghafal bendera dan keunikan negara di dunia adalah hobi saya sejak kecil.</p>
                </article>`
            },
            {
                id: 'my-songs',
                title: '2. My Song for You',
                content: `<article>
                    <h2 style='color: var(--brand);'>Leave - Irghi</h2>
                    <audio controls><source src='assets/leave-irghi.mp3' type='audio/mp3'></audio>
                    <h3 style="color: var(--muted); margin-top: 20px;">Lirik: Leave - Irghi</h3>
                    <p style="font-style: italic; color: var(--muted);">"The sky is beautiful... But not as beautiful as you..."</p>
                </article>`
            },
            {
                id: 'my-shapes',
                title: '4. My Shapes',
                content: `<article>
                    <h2 style="text-align:center; color:var(--brand);">MY SHAPE – Piagam Diri</h2>
                    <div class="shape-wrap" style="margin-top:30px;">
                        <table class="shape-table">
                            <thead><tr><th>Komponen</th><th>Deskripsi Reflektif</th></tr></thead>
                            <tbody>
                                <tr><th>S - Strengths</th><td>Long-term Memory, Ambisius, Adaptif.</td></tr>
                                <tr><th>H - Heart</th><td>Membantu sesama melalui teknologi & edukasi.</td></tr>
                                <tr><th>A - Aptitudes</th><td>UI/UX Design (Figma), Video Editing (Premiere).</td></tr>
                                <tr><th>P - Personality</th><td>Imajinatif, Terstruktur, Berorientasi pada tujuan.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </article>`
            },
            {
                id: 'personal-reviews',
                title: '5. My Personal Reviews',
                content: `<article style="text-align:center;">
                    <h2 style="color:var(--brand);">Dokumen Penilaian Diri</h2>
                    <p style="color:var(--muted); margin-bottom:30px;">Hasil penilaian diri terhadap portofolio UTS-5.</p>
                    <a href="#" class="file-card">
                        <span class="icon">📊</span>
                        <div class="info">
                            <p class="name">UTS-5_Skor_Menilai_Irghi.xlsx</p>
                            <p style="color:var(--muted); font-size:12px; margin:0;">Author: Irghi Satya Priangga</p>
                        </div>
                    </a>
                </article>`
            }
        ];

        // --- Logika Navigasi & Search ---
        const toc = document.getElementById('toc');
        const contentEl = document.getElementById('page-content');
        const titleEl = document.getElementById('page-title');

        function renderToc() {
            const q = document.getElementById('search').value.toLowerCase();
            const filtered = PAGES.filter(p => p.title.toLowerCase().includes(q));
            
            toc.innerHTML = filtered.map(p => 
                `<li><a href="#${p.id}" data-id="${p.id}">${p.title}</a></li>`
            ).join('');

            bindToc();
            const activeId = location.hash.slice(1) || PAGES[0].id;
            setActive(activeId);
        }

        function bindToc() {
            toc.querySelectorAll('a').forEach(a => a.addEventListener('click', (e) => {
                e.preventDefault();
                history.pushState(null, '', '#' + a.dataset.id);
                setActive(a.dataset.id);
            }));
        }

        function setActive(id) {
            toc.querySelectorAll('a').forEach(a => a.classList.toggle('active', a.dataset.id === id));
            const p = PAGES.find(x => x.id === id) || PAGES[0];
            titleEl.textContent = p.title;
            contentEl.innerHTML = p.content;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.getElementById('search').addEventListener('input', renderToc);
        window.addEventListener('hashchange', () => setActive(location.hash.slice(1)));
        
        // Initial Run
        renderToc();
    </script>
</body>
</html>
