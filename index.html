        // LOGIKA NAVIGASI & SEARCH 
        const toc = document.getElementById('toc');
        const contentEl = document.getElementById('page-content');
        const titleEl = document.getElementById('page-title');

        function renderToc() {
            const q = document.getElementById('search').value.toLowerCase().trim();
            const filtered = PAGES.filter(p => p.title.toLowerCase().includes(q) || p.content.toLowerCase().includes(q));
            
            toc.innerHTML = filtered.map(p => `<li><a href="#${p.id}" data-id="${p.id}">${p.title}</a></li>`).join('');
            bindEvents();
            const activeId = location.hash.slice(1) || PAGES[0].id;
            setActive(activeId);
        }

        function bindEvents() {
            toc.querySelectorAll('a').forEach(a => a.addEventListener('click', (e) => {
                e.preventDefault();
                location.hash = a.dataset.id;
                setActive(a.dataset.id);
            }));
        }

        function setActive(id) {
            toc.querySelectorAll('a').forEach(a => a.classList.toggle('active', a.dataset.id === id));
            const p = PAGES.find(x => x.id === id) || PAGES[0];
            titleEl.textContent = p.title;
            contentEl.innerHTML = p.content;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.getElementById('search').addEventListener('input', renderToc);
        window.addEventListener('hashchange', () => setActive(location.hash.slice(1)));
        renderToc();
